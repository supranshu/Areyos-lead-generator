services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: areyos
      POSTGRES_PASSWORD: areyos
      POSTGRES_DB: areyos
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U areyos"]
      interval: 3s
      retries: 20

  migrate:
    build: .
    command: areyos migrate
    env_file: [{path: .env, required: false}]
    environment:
      AREYOS_DATABASE_URL: postgresql+psycopg://areyos:areyos@db:5432/areyos
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    env_file: [{path: .env, required: false}]
    environment:
      AREYOS_DATABASE_URL: postgresql+psycopg://areyos:areyos@db:5432/areyos
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: .
    command: areyos worker
    env_file: [{path: .env, required: false}]
    environment:
      AREYOS_DATABASE_URL: postgresql+psycopg://areyos:areyos@db:5432/areyos
    depends_on:
      migrate: {condition: service_completed_successfully}
    # More throughput: docker compose up --scale worker=4

volumes:
  pgdata:
